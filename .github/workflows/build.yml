name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        id: loc
        run: |
          if [ -f settings.gradle ]; then
            d="."
          elif [ -f DesiDrive.zip ]; then
            unzip -q DesiDrive.zip -d _proj
            d="$(dirname "$(find _proj -name settings.gradle | head -1)")"
          else
            d="$(dirname "$(find . -name settings.gradle | head -1)")"
          fi
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle :android:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp "${{ steps.loc.outputs.dir }}"/android/build/outputs/apk/debug/*.apk out/DesiDrive.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DesiDrive latest APK
          prerelease: true
          files: out/DesiDrive.apk
